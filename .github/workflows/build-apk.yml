name: Build ود فيصل APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. تحميل المشروع
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # 2. إعداد Node.js
      # لا يوجد cache حتى لا نحتاج package-lock.json
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      # =========================================================
      # 3. إعداد Java 21
      # Capacitor 7 يحتاج JDK 21+
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # =========================================================
      # 4. التأكد من Android SDK الموجود مسبقًا
      # لا نستخدم setup-android
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo "Platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 found successfully."

      # =========================================================
      # 5. التحقق من ملفات التطبيق
      # =========================================================
      - name: Check web files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f football.css
          test -f football.js

          echo "All required web files exist."

      # =========================================================
      # 6. إنشاء مجلد www
      # =========================================================
      - name: Create www
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/index.html
          cp football.css www/football.css
          cp football.js www/football.js

          echo "www created:"
          ls -la www

      # =========================================================
      # 7. إنشاء package.json
      # =========================================================
      - name: Create package.json
        shell: bash
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "wad-faisal",
            "version": "1.0.0",
            "private": true,
            "description": "ود فيصل Football App",
            "scripts": {
              "build": "echo Web application ready"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          echo "package.json:"
          cat package.json

      # =========================================================
      # 8. تثبيت Capacitor
      # سيُنشئ package-lock.json تلقائيًا
      # =========================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          npm install --no-audit --no-fund

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Installed packages:"
          npm list --depth=0 || true

      # =========================================================
      # 9. إنشاء إعداد Capacitor
      # =========================================================
      - name: Create Capacitor config
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wadfaisal.app",
            "appName": "ود فيصل",
            "webDir": "www"
          }
          EOF

          echo "capacitor.config.json:"
          cat capacitor.config.json

      # =========================================================
      # 10. إنشاء مشروع Android
      # =========================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          npx cap add android

      # =========================================================
      # 11. مزامنة Capacitor
      # =========================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      # =========================================================
      # 12. فحص مشروع Android
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project is ready."

      # =========================================================
      # 13. معلومات البيئة
      # =========================================================
      - name: Show build environment
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          cd android
          ./gradlew --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      # =========================================================
      # 14. تنظيف مشروع Android
      # =========================================================
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 15. بناء APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 16. التأكد من إنشاء APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      # =========================================================
      # 17. رفع APK إلى GitHub
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wad-faisal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 18. رفع سجل Android عند الفشل
      # =========================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            android/**/*.log
            android/**/build/reports/**
            android/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
